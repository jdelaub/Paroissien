# VM : 2 vCPU, 7,8 Gio. Un seul JVM (Kotlin compile dans le daemon Gradle), jamais en même temps qu'un émulateur.
# En CI, ~/.gradle/gradle.properties prend le pas (plus de workers et de mémoire).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon.idletimeout=1200000
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
