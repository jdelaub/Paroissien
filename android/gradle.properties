# VM : 2 vCPU, 7,8 Gio, hébergée par le NAS. Un seul JVM (Kotlin compile dans le daemon Gradle), jamais en même temps
# qu'un émulateur, un agent, Chrome ou un OCR : la VM et le NAS ont gelé deux fois le 12/10/2026 sous la charge
# (build release + agent). Mémoire et workers bridés en conséquence ; le daemon s'arrête après 5 min d'inactivité.
# En CI, ~/.gradle/gradle.properties prend le pas (plus de workers et de mémoire).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon.idletimeout=300000
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
