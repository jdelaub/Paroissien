[project]
name = "paroissien-content"
version = "0.1.0"
description = "Chaîne de contenu de Paroissien : sources → JSON canonique → paquets SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    # Phase 2 (package). APSW a.b.c.N embarque SQLite a.b.c.
    # La version de SQLite de la chaîne doit rester ≤ celle de
    # androidx.sqlite:sqlite-bundled 2.7.1, soit 3.50.1 (revue 15, M4).
    # Ne monter qu'avec sqlite-bundled. Roues 3.50.1.0 publiées pour cp39 à cp313.
    "apsw==3.50.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/paroissien_content"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
